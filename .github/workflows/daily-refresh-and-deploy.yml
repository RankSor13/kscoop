name: Daily Refresh & Deploy

# Runs daily at 08:00 UTC (16:00 SGT) AND can be triggered manually from the
# Actions tab. The workflow:
#   1. Checks out the repo
#   2. Installs Bun + z-ai SDK
#   3. Refreshes the news dataset (src/data/news.ts) via z-ai web search
#   4. Auto-generates full article bodies (src/data/article-bodies.ts) via z-ai LLM
#   5. Commits the refreshed data back to main
#   6. Builds a static export (out/) using scripts/build-static.sh
#   7. Pushes the static site to the gh-pages branch (which GitHub Pages serves)
#
# Required secrets (Repo → Settings → Secrets and variables → Actions):
#   - ZAI_API_KEY         : your z-ai-web-dev-sdk API key
#
# Optional repo variables (Repo → Settings → Secrets and variables → Actions → Variables):
#   - NEXT_PUBLIC_SITE_URL : your production URL (default: https://<USER>.github.io/<REPO>)
#   - NEXT_PUBLIC_BASE_PATH: repo name with leading slash (default: /<REPO>)

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "next.config.ts"
      - "package.json"
      - ".github/workflows/daily-refresh-and-deploy.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-refresh"
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install z-ai CLI
        run: bun add -g z-ai-web-dev-sdk

      - name: Refresh news data
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: node .github/workflows/refresh-news.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/news.ts src/data/article-bodies.ts
          if git diff --cached --quiet; then
            echo "No new content; skipping commit."
          else
            git commit -m "chore(data): daily news refresh [skip ci]"
            git push
          fi

      - name: Compute deploy URL
        id: url
        run: |
          REPO="${GITHUB_REPOSITORY##*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          # Allow override via repo variable; default to standard GitHub Pages URL
          SITE_URL="${NEXT_PUBLIC_SITE_URL:-https://${OWNER}.github.io/${REPO}}"
          BASE_PATH="${NEXT_PUBLIC_BASE_PATH:-/${REPO}}"
          echo "site_url=$SITE_URL" >> "$GITHUB_OUTPUT"
          echo "base_path=$BASE_PATH" >> "$GITHUB_OUTPUT"
          echo "Computed: SITE_URL=$SITE_URL  BASE_PATH=$BASE_PATH"
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}

      - name: Build static site
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          NEXT_PUBLIC_SITE_URL: ${{ steps.url.outputs.site_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.url.outputs.base_path }}
          STATIC_SITE_URL: ${{ steps.url.outputs.site_url }}
          STATIC_BASE_PATH: ${{ steps.url.outputs.base_path }}
        run: bash scripts/build-static.sh

      - name: Add .nojekyll (so GitHub Pages serves _next/ folder)
        run: touch out/.nojekyll

      - name: Add CNAME (if present)
        run: |
          if [ -f public/CNAME ]; then
            cp public/CNAME out/CNAME
            echo "Custom domain CNAME copied."
          fi

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy: daily refresh ${{ github.run_id }}"
